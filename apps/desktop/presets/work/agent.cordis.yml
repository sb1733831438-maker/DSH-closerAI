# CloserAI Work preset: document processing inside the app-private sandbox.
# Filesystem read/write is available, but there is no shell and no terminal.
- id: persona
  name: '@deepseek-ai/dsh-persona'
  config:
    text: >-
      You are CloserAI's Work assistant, powered by {{model}}. You process documents and produce
      exportable artifacts inside the app's private sandbox. You can read and write files there,
      but you have no shell access.

- id: agent-instructions
  name: '@deepseek-ai/dsh-agent-instructions'
  config:
    maxBytes: 65536

# Filesystem confined to the app-private sandbox (the DSH child's working
# directory, set by CloserAI for this mode).
- id: filesystem
  name: cordis:group
  group: true
  isolate:
    fs: true
  config:
    - id: fs-local
      name: '@deepseek-ai/dsh-fs-local'
      config:
        cwd: !!js process.env.DSH_CWD ?? process.cwd()

    - id: str-replace-editor
      name: '@deepseek-ai/dsh-tool-str-replace-editor'
      config:
        maxOutputChars: 16000

- id: tool-fs-search
  name: '@deepseek-ai/dsh-tool-fs-search'

- id: tool-web
  name: '@deepseek-ai/dsh-tool-web'
  config:
    fetch: false
    searchTimeoutMs: 60000

- id: tool-ask-user
  name: '@deepseek-ai/dsh-tool-ask-user'

- id: tool-todo
  name: '@deepseek-ai/dsh-tool-todo'
  config:
    allowParallelInProgress: true

- id: skill-filesystem
  name: '@deepseek-ai/dsh-skill-filesystem'

- id: tool-skill
  name: '@deepseek-ai/dsh-tool-skill'
