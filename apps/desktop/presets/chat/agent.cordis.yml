# CloserAI Chat preset: conversation, web search/fetch, and shared attachments
# only. No shell, no filesystem tools, no editor, no terminal, no delegation.
- id: persona
  name: '@deepseek-ai/dsh-persona'
  config:
    text: >-
      You are CloserAI's Chat assistant, powered by {{model}}. You hold helpful conversations,
      search and fetch the web, and work with attachments the user shares. You have no shell and
      no filesystem access.

- id: agent-instructions
  name: '@deepseek-ai/dsh-agent-instructions'
  config:
    maxBytes: 65536

- id: tool-web
  name: '@deepseek-ai/dsh-tool-web'
  config:
    fetch: false
    searchTimeoutMs: 60000

- id: tool-ask-user
  name: '@deepseek-ai/dsh-tool-ask-user'

- id: tool-todo
  name: '@deepseek-ai/dsh-tool-todo'
  config:
    allowParallelInProgress: true
