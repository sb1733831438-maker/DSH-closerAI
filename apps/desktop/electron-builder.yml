appId: com.closerai.app
productName: CloserAI
publish:
  provider: github
  owner: sb1733831438-maker
  repo: DSH-closerAI
directories:
  output: release
  buildResources: build-resources
files:
  - dist/**/*
  - presets/**/*
  - resources/**/*
  - package.json
  - '!**/*.map'
  - '!**/node_modules/**/.cache'
# DSH is spawned with ELECTRON_RUN_AS_NODE, which cannot read asar
# archives, so the runtime must ship as real files.
asar: false
win:
  target:
    - target: nsis
      arch:
        - x64
  icon: build-resources/icon.png
nsis:
  oneClick: false
  allowToChangeInstallationDirectory: true
  perMachine: false
  createDesktopShortcut: true
  shortcutName: CloserAI
  artifactName: CloserAI-${version}-Setup-${arch}.${ext}
npmRebuild: false
afterPack: scripts/copy-runtime-node-modules.js
electronDownload:
  cache: null
mac:
  target:
    - target: dmg
      arch:
        - x64
        - arm64
  category: public.app-category.developer-tools
  icon: build-resources/icon.png
  hardenedRuntime: false
  gatekeeperAssess: false
linux:
  target:
    - target: AppImage
      arch:
        - x64
  category: Development
  icon: build-resources/icon.png
  maintainer: CloserAI contributors
  synopsis: DeepSeek Harness desktop client
