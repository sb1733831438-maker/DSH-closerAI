name: release-build

on:
  workflow_dispatch:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  windows-installer:
    name: windows-installer
    runs-on: ubuntu-latest
    container: electronuserland/builder:wine
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 11.21.0

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build workspace deps + desktop
        run: pnpm -r build

      # Linux preserves pnpm's symlinked layout, so electron-builder's
      # collector keeps the DSH runtime's full dependency tree.
      - name: Prepare full runtime node_modules
        run: pnpm --filter @closerai/desktop deploy --legacy .pack-runtime

      - name: Package Windows installer
        env:
          # builder:wine runs as root; wine refuses HOME it does not own
          HOME: /root
          WINEPREFIX: /root/.wine
          CLOSERAI_RUNTIME_NODE_MODULES: /__w/DSH-closerAI/DSH-closerAI/.pack-runtime/node_modules
        run: pnpm --filter @closerai/desktop run pack

      - name: Verify packaged DSH runtime is complete
        run: |
          test -d apps/desktop/release/win-unpacked/resources/app/node_modules/@deepseek-ai/cordis-plugin-group && echo 'cordis-plugin-group present' || (echo 'cordis MISSING'; exit 1)
          test -f apps/desktop/release/win-unpacked/resources/app/node_modules/@deepseek-ai/dsh/lib/bin.js && echo 'dsh bin present'
          ls apps/desktop/release/win-unpacked/resources/app/node_modules/@deepseek-ai/ | wc -l

      - name: Compute SHA-256
        working-directory: apps/desktop/release
        run: |
          sha256sum CloserAI-*-Setup-x64.exe > SHA256SUMS.txt
          cat SHA256SUMS.txt

      - uses: actions/upload-artifact@v4
        with:
          name: windows-installer
          path: |
            apps/desktop/release/CloserAI-*-Setup-x64.exe
            apps/desktop/release/SHA256SUMS.txt

      - uses: actions/upload-artifact@v4
        with:
          name: win-unpacked
          path: apps/desktop/release/win-unpacked/**

      - name: Attach to GitHub Release
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release upload "${GITHUB_REF_NAME}" apps/desktop/release/CloserAI-*-Setup-x64.exe apps/desktop/release/SHA256SUMS.txt --clobber
