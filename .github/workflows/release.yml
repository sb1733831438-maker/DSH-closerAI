name: release-build

on:
  workflow_dispatch:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  windows-installer:
    name: windows-installer
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 11.21.0

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build workspace deps + desktop
        run: pnpm -r build

      # Linux preserves pnpm's symlinked layout, so electron-builder's
      # collector keeps the DSH runtime's full dependency tree.
      - name: Install wine (for Windows packaging)
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends wine64

      - name: Package Windows installer
        run: pnpm --filter @closerai/desktop run pack

      - name: Compute SHA-256
        working-directory: apps/desktop/release
        run: |
          sha256sum CloserAI-*-Setup-x64.exe > SHA256SUMS.txt
          cat SHA256SUMS.txt

      - uses: actions/upload-artifact@v4
        with:
          name: windows-installer
          path: |
            apps/desktop/release/CloserAI-*-Setup-x64.exe
            apps/desktop/release/SHA256SUMS.txt

      - name: Attach to GitHub Release
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release upload "${GITHUB_REF_NAME}" apps/desktop/release/CloserAI-*-Setup-x64.exe apps/desktop/release/SHA256SUMS.txt --clobber
