name: release-build

on:
  workflow_dispatch:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  windows-installer:
    name: windows-installer
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 11.21.0

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build workspace deps + desktop
        run: pnpm -r build

      # npm flat install of the DSH runtime on a Windows runner gives correct
      # native modules (koffi/node-pty) and no symlinks (Windows-safe).
      - name: Prepare flat runtime node_modules (npm)
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path runtime-flat | Out-Null
          Push-Location runtime-flat
          npm init -y | Out-Null
          NODE_OPTIONS=--max-old-space-size=4096 npm install --no-audit --no-fund --ignore-scripts @deepseek-ai/dsh@0.1.0-rc.6
          Pop-Location

      - name: Package Windows installer
        env:
          CLOSERAI_RUNTIME_NODE_MODULES: ${{ github.workspace }}\runtime-flat\node_modules
        run: pnpm --filter @closerai/desktop run pack

      - name: Verify packaged DSH runtime is complete
        shell: pwsh
        run: |
          $app = "apps\desktop\release\win-unpacked\resources\app\node_modules"
          if (Test-Path "$app\@deepseek-ai\cordis-plugin-group") { Write-Host "cordis-plugin-group present" } else { Write-Error "cordis MISSING"; exit 1 }
          if (Test-Path "$app\@deepseek-ai\dsh\lib\bin.js") { Write-Host "dsh bin present" }
          if (Test-Path "$app\@closerai\mock-provider") { Write-Host "@closerai/mock-provider present" } else { Write-Error "@closerai MISSING"; exit 1 }

      - name: Generate SBOM (CycloneDX)
        run: node scripts/generate-sbom.mjs --out apps/desktop/release/SBOM.json

      - name: Compute SHA-256
        shell: pwsh
        run: |
          $exe = Get-ChildItem "apps\desktop\release\CloserAI-*-Setup-x64.exe" | Select-Object -First 1
          Get-FileHash -Algorithm SHA256 $exe.FullName | ForEach-Object { "$($_.Hash.ToLower())  $($exe.Name)" } | Set-Content apps\desktop\release\SHA256SUMS.txt
          Get-Content apps\desktop\release\SHA256SUMS.txt

      - uses: actions/upload-artifact@v4
        with:
          name: windows-installer
          path: |
            apps/desktop/release/CloserAI-*-Setup-x64.exe
            apps/desktop/release/SHA256SUMS.txt
            apps/desktop/release/latest.yml
            apps/desktop/release/SBOM.json

      - name: Attach to GitHub Release
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release upload "$env:GITHUB_REF_NAME" "apps/desktop/release/CloserAI-*-Setup-x64.exe" "apps/desktop/release/SHA256SUMS.txt" "apps/desktop/release/latest.yml" "apps/desktop/release/SBOM.json" --clobber
        shell: pwsh
  cross-installer:
    name: ${{ matrix.platform }} installer
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-latest
            platform: mac
            script: pack:mac
            asset_glob: 'CloserAI-*-*.dmg'
            update_yml: 'latest-mac.yml'
          - os: ubuntu-latest
            platform: linux
            script: pack:linux
            asset_glob: 'CloserAI-*.AppImage'
            update_yml: 'latest-linux.yml'
    runs-on: ${{ matrix.os }}
    env:
      # No code-signing cert for mac yet; build unsigned.
      CSC_IDENTITY_AUTO_DISCOVERY: 'false'
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 11.21.0

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build workspace deps + desktop
        run: pnpm -r build

      - name: Prepare flat runtime node_modules (npm)
        shell: bash
        run: |
          mkdir -p runtime-flat
          cd runtime-flat
          npm init -y >/dev/null 2>&1
          npm install --no-audit --no-fund --ignore-scripts @deepseek-ai/dsh@0.1.0-rc.6

      - name: Package ${{ matrix.platform }} installer
        env:
          CLOSERAI_RUNTIME_NODE_MODULES: ${{ github.workspace }}/runtime-flat/node_modules
        run: pnpm --filter @closerai/desktop run ${{ matrix.script }}

      - name: Verify packaged DSH runtime is complete
        run: |
          find apps/desktop/release -path '*resources/app/node_modules/@deepseek-ai/dsh/lib' -type d | head -1
          find apps/desktop/release -path '*resources/app/node_modules/@closerai' -type d | head -1
          find apps/desktop/release -name '*.dmg' -o -name '*.AppImage' | head -3

      - name: Attach to GitHub Release
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release upload "$env:GITHUB_REF_NAME" apps/desktop/release/${{ matrix.asset_glob }} apps/desktop/release/${{ matrix.update_yml }} --clobber
        shell: pwsh
