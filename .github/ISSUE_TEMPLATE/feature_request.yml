name: Feature request
description: Suggest a feature for CloserAI
labels: [enhancement]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for suggesting an improvement. Please check
        [`docs/ROADMAP.md`](../../docs/ROADMAP.md) first — the idea may
        already be tracked.

  - type: textarea
    id: problem
    attributes:
      label: Problem
      description: What problem does this solve? Who is it for?
    validations:
      required: true

  - type: textarea
    id: solution
    attributes:
      label: Proposed solution
      description: How should it work? Keep it concrete enough to evaluate.
    validations:
      required: true

  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives considered
    validations:
      required: false

  - type: textarea
    id: notes
    attributes:
      label: Additional context
      description: >-
        Screenshots, links to similar clients (Jan, Cherry Studio, ...), etc.
    validations:
      required: false
